[project]
name = "hotel-concierge-backend"
version = "1.0.0"
description = "Autonomous Multi-Agent Local Business Concierge — Backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.115.4",
    "uvicorn[standard]==0.30.6",
    # Database
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg>=0.30,<1",
    "alembic==1.13.3",
    # AI / LangGraph. LLM calls go straight to provider HTTP APIs via httpx (no LangChain needed).
    # interrupt/Command-era LangGraph (>=0.4) plus the PostgreSQL checkpointer.
    "langgraph>=0.4,<2",
    "langgraph-checkpoint-postgres>=2.0,<4",
    "psycopg[binary,pool]>=3.2,<4",
    # Validation and settings
    "pydantic>=2.8.2,<3",
    "pydantic-settings>=2.5.2,<3",
    "email-validator==2.2.0",
    # Logging
    "structlog==24.4.0",
    # HTTP client
    "httpx==0.27.2",
    # Auth
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.2.0",
    "passlib[bcrypt]==1.7.4",
    # File handling
    "python-multipart==0.0.12",
    "aiofiles==24.1.0",
    # PDF processing
    "PyMuPDF==1.24.12",
    # Notifications (built-in, no extra deps for mock)
    # Voice: Whisper/OpenAI TTS use plain HTTPS (httpx). Google providers are optional extras below.
]

[project.optional-dependencies]
# Full multilingual semantic embeddings (~1 GB download, requires torch/CUDA).
# Install with: pip install -e ".[embeddings]"
# When not installed, use EMBEDDING_PROVIDER=hashing in .env (fast, lexical only).
embeddings = [
    "sentence-transformers==3.2.1",
]
voice-google = [
    "google-cloud-speech>=2.26",
    "google-cloud-texttospeech>=2.16",
]
dev = [
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "numpy==2.1.3",
    "pip-audit==2.7.3",
    # Type stubs
    "types-passlib==1.7.7.20240327",
    "types-aiofiles==24.1.0.20240626",
]

[build-system]
requires = ["setuptools>=74", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "S",   # flake8-bandit (security)
    "ANN", # flake8-annotations
]
ignore = [
    "ANN101", # missing type annotation for self
    "ANN102", # missing type annotation for cls
    "S101",   # use of assert (allowed in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "S105", "S106", "E501"]
"scripts/*" = ["S101", "ANN", "E501"]
"alembic/*" = ["ANN"]
"app/api/*" = ["S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# Mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_decorators = false  # FastAPI decorators are untyped
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/", "scripts/"]

[[tool.mypy.overrides]]
module = "pgvector.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fitz.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_openai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "passlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jose.*"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:anyio",
    "ignore::DeprecationWarning:jose",
    # Windows proactor cleanup error -- spurious on Python 3.13 + Windows
    "ignore::ResourceWarning",
]
markers = [
    "unit: fast, no external dependencies",
    "integration: requires test database",
    "sparrow: requires real Sparrow SMS API token",
    "slow: takes more than 5 seconds",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "alembic/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
